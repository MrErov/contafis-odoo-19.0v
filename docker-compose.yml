services:
  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8090:8069"
      - "8073:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf/odoo.conf:/etc/odoo/odoo.conf
      - ./addons:/mnt/extra-addons
    command: --
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data: