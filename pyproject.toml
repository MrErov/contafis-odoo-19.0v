[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
    "addons/l10n_ve_compliance_manager/migrations",
    "addons/l10n_ve_compliance_manager/static/description",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/*" = ["E501"]
"**/models/__init__.py" = ["F401"]
